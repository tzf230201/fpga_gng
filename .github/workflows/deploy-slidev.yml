name: Deploy Slidev to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web_page/slidev/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci
        working-directory: web_page/slidev

      - name: Prepare website shell
        working-directory: web_page
        run: |
          rm -rf out
          mkdir -p out
          cp index.html styles.css README.md WEB_VERSION_SCIENTIFIC_STUDY.md out/
          cp -R images out/
          mkdir -p out/publication_materials
          cp -R publication_materials/published/. out/publication_materials/
          cp publication_materials/dataset_two_moons.csv publication_materials/dataset_concentric_circle.csv out/publication_materials/

      - name: Build Slidev
        run: npm run build:gh
        working-directory: web_page/slidev

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_page/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
